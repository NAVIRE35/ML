[project]
name = "ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nathanaël Villain" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "ucimlrepo>=0.0.7",
    "xlrd>=2.0.2",
]

[project.scripts]
ml = "ml:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
